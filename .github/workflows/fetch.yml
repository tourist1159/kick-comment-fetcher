name: Kick Comment Auto Fetcher

on:
  schedule:
    # 毎時0分に実行（例: JSTだと9時＝UTC 0時）
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # ← これが重要！pushするために必要

# 同時実行を防ぐ。コメント取得は1配信ぶんを5秒刻みでページングするため、4時間の配信で
# 80分ほどかかる(実測)。その最中に別の run が走ると、両者が kick_archives.json を
# 書いて git pull --rebase でコンフリクトし、後から終わった方が失敗する(実測)。
# cancel-in-progress: false = 走行中のものは殺さず、次を待たせる。
concurrency:
  group: kick-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # === 1. リポジトリを取得 ===
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # === 2. pipキャッシュ（pandasなどの高速化） ===
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # === 3. Python環境をセットアップ ===
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # === 4. 依存関係をインストール ===
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # === 5. メタ情報だけ先に取得・push (コメント集計を待たずにタイムラインに反映) ===
      - name: Run Kick meta fetcher
        run: python kick_meta_fetch.py

      - name: Commit and push meta updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kick_archives.json
          git commit -m "Update Kick archive metadata [skip ci]" || echo "No changes"
          git pull --rebase
          git push

      # === 6. 未処理(number_of_comments無し)のアーカイブのコメントを取得 ===
      - name: Run Kick comment fetcher
        env:
          GITHUB_ACTIONS: "true"   # ← フォルダ分離の判定に必要！
        run: python kick_comment_fetch.py

      # === 7. 古いコメントデータ削除後、コミットしてpush ===
      - name: Commit and push comment updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Kick comments [skip ci]" || echo "No changes"
          git pull --rebase
          git push
